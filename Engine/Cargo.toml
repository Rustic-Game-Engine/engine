[workspace]
members = [
    "apps/agent-backend",
    "apps/asset-worker",
    "apps/editor",
    "apps/project-manager",
    "apps/runtime",
    "crates/engine-assets",
    "crates/engine-core",
    "crates/engine-editor",
    "crates/engine-play",
    "crates/engine-platform",
    "crates/engine-project",
    "crates/engine-rhi",
    "crates/engine-scripting",
    "crates/engine-world",
    "crates/renderer-wgpu",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["Rustic Game Engine Contributors"]

[workspace.dependencies]
crossbeam-channel = "0.5.16"
bevy_ecs = "0.19.1"
directories = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "persistence", "wgpu", "wayland", "x11"] }
egui_tiles = "0.17.1"
egui_extras = { version = "0.36.0", features = ["svg"] }
glam = { version = "0.33.2", features = ["serde"] }
gltf = { version = "1.4.1", default-features = false, features = ["names", "utils"] }
hound = "3.5.1"
image = { version = "0.25.8", default-features = false, features = ["hdr", "jpeg", "png", "tga"] }
interprocess = "2.4.0"
mlua = { version = "0.11.4", features = ["lua54", "vendored", "send", "serialize"] }
lewton = "0.10.2"
naga = { version = "30.0.1", features = ["wgsl-in"] }
num-traits = "0.2"
parking_lot = "0.12.5"
pollster = "0.4.0"
ron = "0.12.2"
resvg = "0.45.1"
rquickjs = { version = "0.12.1", features = ["parallel"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
toml_edit = "0.25.13"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros"] }
tobj = "4.0.3"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "gles", "metal", "parking_lot", "std", "vulkan", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
debug = 1

[profile.dev-fast]
inherits = "dev"
debug = 0
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.distribution]
inherits = "release"
panic = "unwind"
