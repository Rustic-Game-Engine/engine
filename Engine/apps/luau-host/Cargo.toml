[package]
name = "rustic-luau-host"
version = "0.1.0"
edition = "2024"
publish = false

# Keep Luau and Lua 5.4 native-library features in separate Cargo graphs.
[workspace]

[dependencies]
mlua = { version = "0.11.6", features = ["luau", "vendored", "serialize"] }
serde_json = "1.0.151"

[profile.distribution]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 8
strip = "debuginfo"

[profile.dev-fast]
inherits = "dev"
opt-level = 1
debug = 1
