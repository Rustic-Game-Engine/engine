[package]
name = "rustic-browser"
description = "Direct browser game runtime using the shared Rustic simulation and renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
engine-core = { path = "../../crates/engine-core", version = "0.1.0" }
engine-play = { path = "../../crates/engine-play", version = "0.1.0", default-features = false }
engine-assets = { path = "../../crates/engine-assets", version = "0.1.0" }
renderer-wgpu = { path = "../../crates/renderer-wgpu", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
resvg.workspace = true
epaint_default_fonts = "0.36.1"
engine-scripting = { path = "../../crates/engine-scripting", version = "0.1.0" }

# Exported Emscripten entry points require no_mangle. Only those attributes are
# allowed below; the runtime contains no unsafe operations or raw-pointer API.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "emscripten")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[build-dependencies]
cc = "1.4.4"
