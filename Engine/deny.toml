[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# SVG loaders in egui_extras/resvg still require these crates. These are
# maintenance notices with no fixed release, not vulnerability exemptions.
ignore = [
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is transitive via resvg/usvg SVG text rendering; upstream has no compatible maintained release yet" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is transitive via usvg/fontdb; upstream has no compatible maintained release yet" },
]

[licenses]
version = 2
confidence-threshold = 0.8
private = { ignore = true }
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Ubuntu-font-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
