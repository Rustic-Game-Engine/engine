name: GPT-6 Luna review

# The privileged review reads diffs and requested Git blobs as data; it never executes PR code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, work]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: luna-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    name: GPT-6 Luna review
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout trusted review tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github
      - name: Review security, correctness, quality, and missing tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ai_review.py
      - name: Upload review report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gpt-6-luna-review
          path: review-report.md
          if-no-files-found: warn
          retention-days: 14
