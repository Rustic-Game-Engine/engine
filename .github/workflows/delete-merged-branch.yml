name: Delete merged PR branch

# Use trusted base-branch code and never check out or execute PR contents.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'work'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete merged source branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const branch = pr.head.ref;
            if (!pr.merged || ['main', 'work'].includes(branch) ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.info('Skipping an unmerged PR, preserved branch, or fork.');
              return;
            }

            let ref;
            try {
              ref = await github.rest.git.getRef({
                ...context.repo,
                ref: `heads/${branch}`,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('Branch is already deleted.');
              return;
            }

            if (ref.data.object.sha !== pr.head.sha) {
              core.info('Branch has changed since this PR; keeping it.');
              return;
            }

            await github.rest.git.deleteRef({
              ...context.repo,
              ref: `heads/${branch}`,
            });
            core.info('Deleted merged PR source branch.');
