name: Update Supported Versions

on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_run:
    workflows: ["Publish installer release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-supported-versions
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Update README and security policy
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const paths = ["README.md", "SECURITY.md"];
            const supportedCount = 7;

            const releases = (
              await github.paginate(github.rest.repos.listReleases, {
                owner,
                repo,
                per_page: 100
              })
            )
              .filter(r => !r.draft && r.published_at)
              .sort((a, b) =>
                Date.parse(b.published_at) - Date.parse(a.published_at) ||
                b.id - a.id
              )
              .slice(0, supportedCount);

            if (releases.length === 0) {
              throw new Error("No published releases found.");
            }

            const escapeCell = value => String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/\|/g, "&#124;")
              .replace(/[\r\n]+/g, " ");

            const start = "<!-- supported-versions:start -->";
            const end = "<!-- supported-versions:end -->";

            const table = [
              start,
              "| Version | Supported | Download |",
              "| ------- | --------- | -------- |",
              ...releases.map((release, index) => {
                const version = escapeCell(release.tag_name);
                const status = index === 0 ? "✅ Latest" : "✅";
                return `| ${version} | ${status} | [Download](${release.html_url}) |`;
              }),
              end
            ].join("\n");

            const { data: repository } = await github.rest.repos.get({
              owner,
              repo
            });
            const branch = repository.default_branch;

            // Validate both files before making any updates.
            const changes = [];

            for (const path of paths) {
              const { data: file } = await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: branch
              });

              if (Array.isArray(file) || file.type !== "file") {
                throw new Error(`${path} must be a file.`);
              }

              const original = Buffer.from(file.content, "base64")
                .toString("utf8");

              const startIndex = original.indexOf(start);
              const endIndex = original.indexOf(end);

              if (
                startIndex < 0 ||
                endIndex < startIndex ||
                original.indexOf(start, startIndex + start.length) !== -1 ||
                original.indexOf(end, endIndex + end.length) !== -1
              ) {
                throw new Error(
                  `Expected exactly one pair of table markers in ${path}.`
                );
              }

              const updated =
                original.slice(0, startIndex) +
                table +
                original.slice(endIndex + end.length);

              if (updated !== original) {
                changes.push({ path, sha: file.sha, content: updated });
              }
            }

            for (const change of changes) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                branch,
                path: change.path,
                sha: change.sha,
                message: `docs: refresh supported releases in ${change.path}`,
                content: Buffer.from(change.content, "utf8")
                  .toString("base64")
              });
            }

            core.info(
              changes.length
                ? `Updated ${changes.length} file(s).`
                : "Both tables are already up to date."
            );
