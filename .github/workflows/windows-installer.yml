name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [codex/windows-installer-download]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
        working-directory: Engine
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Engine/
            !/Engine/target*/
            !/Engine/.tools/
            !/Engine/dist/
      - name: Build Windows installer
        run: ./tools/build-windows-installer.ps1
      - name: Upload installer
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: RusticGameEngine-Windows-Installer
          path: Engine/dist/RusticGameEngine-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
