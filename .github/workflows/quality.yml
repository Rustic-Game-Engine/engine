name: Code quality and security

on:
  pull_request:
  push:
    branches: [main, work]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: Engine
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libegl1 libgl1-mesa-dri mesa-vulkan-drivers
          # Headless runtime tests still render frames; use Mesa's CPU Vulkan driver.
          vulkan_driver="$(dpkg -L mesa-vulkan-drivers | grep -E '/lvp_icd.*\.json$')"
          test -f "$vulkan_driver"
          install -d -m 700 "$RUNNER_TEMP/xdg-runtime"
          echo "VK_DRIVER_FILES=$vulkan_driver" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
      - name: Install repository-pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path apps/luau-host/Cargo.toml --check
      - name: Clippy (warnings are errors)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked --manifest-path apps/luau-host/Cargo.toml --all-targets -- -D warnings
      - name: Build bundled Luau host
        if: ${{ !cancelled() }}
        run: cargo build --locked --manifest-path apps/luau-host/Cargo.toml --target-dir target
      - name: Initialize .NET before parallel adapter tests
        if: ${{ !cancelled() }}
        run: |
          if command -v dotnet >/dev/null 2>&1; then
            dotnet new console --output "$RUNNER_TEMP/dotnet-warmup" --no-restore
            dotnet build "$RUNNER_TEMP/dotnet-warmup" --nologo
          fi
      - name: Unit, integration, and documentation tests
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --workspace
          cargo test --locked --manifest-path apps/luau-host/Cargo.toml
      - name: Verify rendered lighting and viewport
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: cargo test --locked -p renderer-wgpu -- --include-ignored
      - name: Check all targets
        if: ${{ !cancelled() }}
        run: cargo check --locked --workspace --all-targets
      - name: Headless application smoke tests
        if: ${{ !cancelled() }}
        run: |
          cargo run --locked -p rustic-project-manager -- --headless-smoke
          cargo run --locked -p rustic-editor -- --headless-smoke
          if cargo run --locked -p rustic-project-manager -- --headless-smoke-fail; then
            echo 'The deliberate failure smoke test unexpectedly succeeded.' >&2
            exit 1
          fi

  rust-security:
    name: Rust dependency security and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Engine
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo install cargo-deny --locked --version 0.20.2
      - run: cargo deny --locked check --hide-inclusion-graph
      - name: Audit standalone Luau host dependencies
        working-directory: Engine/apps/luau-host
        run: cargo deny --locked --config ../../deny.toml check --hide-inclusion-graph

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner

  language-adapters:
    name: Language adapter conformance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: Engine
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Native, JVM, and PHP toolchains
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang g++ openjdk-21-jdk php-cli libwayland-dev libxkbcommon-dev libx11-dev
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Initialize .NET before parallel adapter tests
        run: |
          dotnet new console --output "$RUNNER_TEMP/dotnet-warmup" --no-restore
          dotnet build "$RUNNER_TEMP/dotnet-warmup" --nologo
      - run: rustup show active-toolchain
      - run: cargo build --locked --manifest-path apps/luau-host/Cargo.toml --target-dir target
      - run: PATH="$PWD/target/debug:$PATH" cargo test --locked -p engine-scripting external_runtime -- --nocapture

  installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: Engine
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build a fresh Windows installer
        run: |
          Remove-Item 'dist/RusticGameEngine-Setup-*.exe' -ErrorAction SilentlyContinue
          powershell -ExecutionPolicy Bypass -File ./tools/build-windows-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem 'dist/RusticGameEngine-Setup-*.exe' -ErrorAction SilentlyContinue)) {
            throw 'No fresh Windows installer was produced.'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-installer
          path: Engine/dist/RusticGameEngine-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  workflow-syntax:
    name: Workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Test installer release automation
        run: python3 -m unittest discover -s .github/tests -v
      - name: Validate GitHub workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [engine, rust-security, secrets, language-adapters, installer, workflow-syntax]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report and enforce all results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          results = json.loads(os.environ['RESULTS'])
          lines = ['## Code quality and security', '', '| Check | Result |', '| --- | --- |']
          lines.extend(f"| {name} | {job['result']} |" for name, job in results.items())
          lines += ['', 'Open the failed job and step logs for the exact issues.']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          sys.exit(0 if all(job['result'] == 'success' for job in results.values()) else 1)
          PY
