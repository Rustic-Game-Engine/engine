name: GPT-6 Luna full sweep

on:
  workflow_run:
    workflows: [Code quality and security]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number (blank reviews this branch)
        type: string
        required: false

permissions:
  contents: read
  actions: read
  statuses: write
  pull-requests: write

concurrency:
  group: luna-sweep-${{ github.event.workflow_run.head_sha || github.event.inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  sweep:
    name: GPT-6 Luna full sweep
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # workflow_run uses tooling on the trusted default branch. PR code is data.
      - name: Checkout trusted sweep tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: .github
      - name: Review source, requirements, and exact-commit CI evidence
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/full_review.py
      - name: Upload findings and coverage manifest
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gpt-6-luna-full-sweep
          path: |
            review-report.md
            review-coverage.json
            review-findings.json
          if-no-files-found: warn
          retention-days: 14
