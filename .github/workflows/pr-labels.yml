name: Sync PR labels

on:
  push:
    paths:
      - ".github/workflows/pr-labels.yml"
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: sync-pr-labels
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create missing PR labels
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = [
              {
                "name": "type:feature",
                "color": "0E8A16",
                "description": "New functionality"
              },
              {
                "name": "type:fix",
                "color": "D73A4A",
                "description": "Bug fixes"
              },
              {
                "name": "type:docs",
                "color": "0075CA",
                "description": "Documentation changes"
              },
              {
                "name": "type:refactor",
                "color": "D4C5F9",
                "description": "Restructuring without changing behavior"
              },
              {
                "name": "type:test",
                "color": "FBCA04",
                "description": "Test additions or changes"
              },
              {
                "name": "type:chore",
                "color": "CFD3D7",
                "description": "Maintenance, dependencies, or tooling"
              },
              {
                "name": "area:engine",
                "color": "B60205",
                "description": "Rust game engine and engine documentation"
              },
              {
                "name": "area:website",
                "color": "1D76DB",
                "description": "Documentation website"
              },
              {
                "name": "area:ci",
                "color": "5319E7",
                "description": "GitHub Actions, CI, and repository automation"
              }
            ];
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100
            });
            const names = new Set(existing.map(label => label.name.toLowerCase()));
            for (const label of labels) {
              if (names.has(label.name.toLowerCase())) {
                core.info(`Label already exists: ${label.name}`);
                continue;
              }
              await github.rest.issues.createLabel({ ...context.repo, ...label });
              core.info(`Created label: ${label.name}`);
            }
